<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./dist/index.js"></script>
    <title>Bulls and Cows</title>
    <style>
      header,
      section {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 10px;
      }
      header,
      main {
        max-width: 1000px;
        margin: 0 auto;
      }
      header {
        padding: 10px;
        margin-bottom: 20px;
        border-bottom: 2px solid gray;
      }
      section {
        padding: 20px;
      }
      fieldset {
        flex-grow: 1;
        display: flex;
        justify-content: space-between;
      }
      fieldset:has(input[type='text']) {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
      }
      input[type='text'] {
        flex-grow: 1;
      }
      button:hover {
        cursor: pointer;
      }
      .possible-numbers,
      .error-guess {
        margin: 0;
        width: 100%;
      }
      .win-game {
        padding: 10px;
        border: 2px solid green;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 1;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .logs {
        flex-direction: column;
      }
    </style>
  </head>
  <body></body>
</html>
